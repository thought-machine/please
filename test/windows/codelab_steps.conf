; Decisions about what the codelabs mean, for //test/windows/codelab_script, which reduces
; docs/codelabs/*.md to a plan that run_codelabs.ps1 replays on a real Windows machine.
;
; Kept here rather than in the prose, because the codelabs are documentation and have to read as
; documentation. Nothing in this file edits a codelab or makes one pass: it says what a block is
; where the Markdown cannot, and which steps cannot run on a CI machine at all.
;
; Every stanza needs a comment directly above it saying why; the parser refuses one without.
; "matches" pins the text the decision was made about, so an edit to a codelab fails extraction
; on Linux instead of quietly moving a decision onto a different block. Keys are printed by:
;
;   plz run //test/windows/codelab_script -- --sidecar test/windows/codelab_steps.conf \
;       --format summary docs/codelabs/*.md
;
; Directives: matches, kind (file:<path> | command | transcript | illustration | ignore),
; mode (write | merge), skip (a reason class), needs (docker, kubectl, minikube, ...),
; blocking (false: a failure here does not block the rest), assert, timeout, not-runnable.
;
; Merging a .plzconfig fragment appends it. That is sound for this config format: a repeated
; section merges, a repeated single-valued key takes the last value, and a list appends.

; ---- github_actions -----------------------------------------------------------------------

; Teaches CI configuration, and every block is the YAML of a workflow. There is nothing in it
; anyone runs locally, on any OS.
[github_actions]
not-runnable = no local commands; every block is GitHub Actions YAML

; ---- genrule ------------------------------------------------------------------------------

; A walk-through of an interactive `plz build --shell` session, bash-4.4$ prompts included. It
; shows what the reader will see after typing, not something a script can replay.
[genrule::the-build-directory/b1]
matches = $ plz build --shell :word_count
kind = illustration

; The printenv output from inside that same interactive shell.
[genrule::the-build-directory/b2]
matches = bash-4.4$ printenv
kind = illustration

; A [buildconfig] section to add to the .plzconfig plz init wrote, not the whole file. Written
; verbatim it would drop everything plz init put there.
[genrule::configuration/b1]
matches = .plzconfig
mode = merge

; ---- go_intro -----------------------------------------------------------------------------

; Shows what plz init plugin go has already written ("Please will have initialised this ... for
; us"). Writing it again would replace the generated file with a copy that differs from it.
[go_intro::initialising-your-project/b3]
matches = [parse]
kind = illustration

; Adds ImportPath to the plugin section plz init plugin go wrote.
[go_intro::setting-up-our-import-path/b1]
matches = .plzconfig
mode = merge

; Adds GoTool to the same section, for the managed toolchain the codelab recommends.
[go_intro::setting-up-your-toolchain/b2]
matches = .plzconfig
mode = merge

; The default [build] path, shown for information.
[go_intro::setting-up-your-toolchain/b3]
matches = /usr/local/bin:/usr/bin:/bin
kind = illustration

; The alternative to the managed toolchain: Go from the system PATH. The codelab offers the two
; as a choice and recommends the other, which is the one followed here. Its example is a
; colon-separated Unix path with no Windows form given, which is worth knowing when the docs
; decision is taken; on Windows the default [build] path is empty.
[go_intro::setting-up-your-toolchain/b4]
matches = [Build]
kind = ignore

; Part of the same system-PATH alternative, not the recommended route. Also bash syntax: an
; inline environment prefix is a command name to PowerShell.
[go_intro::setting-up-your-toolchain/b5]
matches = GODEBUG="installgoroot=all" go install std
skip = alternative-route

; ---- python_intro -------------------------------------------------------------------------

; Conditional ("If Python isn't in this path") and a template rather than a value:
; $YOUR_PYTHON_INSTALL_HERE followed by a colon-separated Unix path. There is no Windows form to
; follow. On Windows the default [build] path is empty, so whatever this costs shows up in the
; steps that need an interpreter, and is recorded there.
[python_intro::initialising-your-project/b2]
matches = [build]
kind = ignore

; Shows what plz init plugin python has already written.
[python_intro::initialising-your-project/b4]
matches = [parse]
kind = illustration

; Runs the built .pex directly, which depends on a shebang and an executable bit. Nothing later
; in the codelab depends on it, so a failure here is recorded without blocking what follows.
[python_intro::adding-modules/b4.2]
matches = plz-out/bin/src/main.pex
blocking = false

; Adds ModuleDir to the plugin section plz init plugin python wrote.
[python_intro::third-party-dependencies/b2]
matches = .plzconfig
mode = merge

; Conditional: only "if you encounter an error eg. no such option: --system". Not an instruction
; to follow unconditionally.
[python_intro::third-party-dependencies/b3]
matches = [plugin "python"]
kind = ignore

; ---- puku ---------------------------------------------------------------------------------

; A [buildconfig] entry to add to the .plzconfig plz init wrote.
[puku::initialising-your-project-and-running-puku-with-please/b2]
matches = .plzconfig
mode = merge

; "Uncomment and edit the following lines" - an edit with no verbatim reading. Carried out, it
; pins Please 17.22.0, so please.exe would try to replace itself with an upstream release that
; has no Windows build, and the check would stop testing the binary it was given.
[puku::initialising-your-project-and-running-puku-with-please/b3]
matches = [please]
kind = ignore

; The Puku alias every later step uses as `plz puku`. Introduced as "optional but convenient",
; so no heading names the file; it is a fragment for .plzconfig.
[puku::initialising-your-project-and-running-puku-with-please/b4]
matches = [Alias "puku"]
kind = file:.plzconfig
mode = merge

; Adds ModFile to the plugin section plz init plugin go wrote.
[puku::initialising-your-project-and-running-puku-with-please/b7]
matches = .plzconfig
mode = merge

; The default [build] path, shown for information.
[puku::initialising-your-project-and-running-puku-with-please/b8]
matches = /usr/local/bin:/usr/bin:/bin
kind = illustration

; An example [build] path for Go installed by Homebrew on macOS. Conditional, and Unix-only; the
; codelab's only Windows note is to use where.exe to find Go, with no path form to put here.
[puku::initialising-your-project-and-running-puku-with-please/b10]
matches = [Build]
kind = ignore

; The same example for Go under /usr/local/go.
[puku::initialising-your-project-and-running-puku-with-please/b11]
matches = [Build]
kind = ignore

; Bash syntax: an inline environment prefix is a command name to PowerShell. Later steps need
; the standard library this installs, but blocking on it would hide every other finding in the
; codelab behind a line whose failure is already understood.
[puku::initialising-your-project-and-running-puku-with-please/b12]
matches = GODEBUG="installgoroot=all" go install std
blocking = false

; Bash syntax, as above. The sync after it still runs.
[puku::adding-and-updating-modules/b7.1]
matches = GOTOOLCHAIN=local go get github.com/google/uuid@v1.6.0
blocking = false

; Bash syntax, as above.
[puku::adding-and-updating-modules/b8.1]
matches = GOTOOLCHAIN=local go get -u github.com/google/uuid
blocking = false

; Troubleshooting advice with <module-name> as a placeholder. Not something to run as written.
[puku::adding-and-updating-modules/b9]
matches = go get <module-name>
skip = placeholder

; The same advice for a different error message.
[puku::adding-and-updating-modules/b10]
matches = go get <module-name>
skip = placeholder

; github.com/example/module is a stand-in, not a real module, and `go get -u` on it two blocks
; later fails on every platform. The four blocks demonstrate go.mod directives on it and are
; skipped together; the real scenario with google/uuid that follows them runs.
[puku::stop-a-module-from-updating/b1]
matches = go mod edit -exclude github.com/example/module@v2.0.0
skip = placeholder

; As above.
[puku::stop-a-module-from-updating/b2]
matches = go mod edit -dropexclude github.com/example/module@v2.0.0
skip = placeholder

; As above.
[puku::stop-a-module-from-updating/b3]
matches = go mod edit -replace github.com/example/module=github.com/example/module@v1.5.0
skip = placeholder

; As above.
[puku::stop-a-module-from-updating/b4]
matches = go mod edit -dropreplace github.com/example/module
skip = placeholder

; //third_party/go:module_name is a placeholder, as the prose around it says.
[puku::removing-modules/b1]
matches = plz query revdeps //third_party/go:module_name --level=-1 | grep -v //third_party/go
skip = placeholder

; github.com/example/module again: dropping a requirement that was never added.
[puku::removing-modules/b2]
matches = go mod edit -droprequire github.com/example/module
skip = placeholder

; Examples of how a BUILD file could look, for a package (mylib) the codelab never creates.
[puku::using-new-modules/b1]
matches = go_library(
kind = illustration

; As above: an alternative form of go_repo, not the one the codelab built.
[puku::using-new-modules/b2]
matches = go_repo(
kind = illustration

; As above.
[puku::using-new-modules/b3]
matches = go_library(
kind = illustration

; Watches the tree until interrupted. It never exits by itself, on any platform.
[puku::using-new-modules/b4]
matches = plz puku watch //src/...
skip = interactive

; ---- k8s ----------------------------------------------------------------------------------

; "Add a go toolchain to `third_party/go/BUILD`" - no trailing colon, so the prose rule does not
; read it, and the fence says go when the content is a BUILD file.
[k8s::creating-a-service/b2]
matches = go_toolchain(
kind = file:third_party/go/BUILD

; "And configure the plugin:" - a fragment for the plugin section plz init plugin go wrote.
[k8s::creating-a-service/b3]
matches = [Plugin "go"]
kind = file:.plzconfig
mode = merge

; Starts an HTTP server in the foreground, then relies on bash job control and pkill to reach
; and stop it. A non-interactive runner cannot do that on any platform: the first command never
; returns.
[k8s::creating-a-service/b6]
matches = plz run //hello_service:hello_service && curl localhost:8000
skip = interactive

; Loads the image into a Docker daemon.
[k8s::building-a-docker-image/b6]
matches = plz run //common/docker:base
needs = docker

; "Create a `hello_service/k8s/Dockerfile` for our hello service:" wraps onto a second line, so the
; path is not on the line the prose rule reads. A real file the image build below depends on.
[k8s::using-our-base-image/b1]
matches = FROM //common/docker:base
kind = file:hello_service/k8s/Dockerfile

; Starts a minikube cluster, whose default driver is Docker.
[k8s::local-testing-with-minikube/b2]
matches = plz run //third_party/binary:minikube -- start
needs = docker

; bash command substitution feeding eval. No PowerShell reading.
[k8s::local-testing-with-minikube/b3]
matches = eval $(plz run //third_party/binary:minikube -- docker-env)
skip = unix-shell

; Loads the image and applies the manifests to the cluster.
[k8s::local-testing-with-minikube/b4]
needs = docker, kubectl

; Holds a port-forward open in the foreground and curls through it.
[k8s::local-testing-with-minikube/b5]
matches = kubectl port-forward service/hello-svc 8000:8000 && curl localhost:8000
skip = interactive

; Builds and pushes to the cluster.
[k8s::please-deploy/b1]
matches = plz run sequential --include docker-build --include k8s-push //hello_service/...
needs = docker, kubectl

; The deploy alias, for .plzconfig.
[k8s::please-deploy/b2]
matches = .plzconfig
mode = merge

; The same deploy, through the alias.
[k8s::please-deploy/b3]
matches = plz deploy //hello_service/...
needs = docker, kubectl

; An example rule in a discussion section, for a package the codelab never creates.
[k8s::docker-build-and-build-systems/b1]
matches = docker_image(
kind = illustration

